name: Product matching tests

on:
  push:
    branches:
      - main
    paths:
      - "product_matching.py"
      - "search_query.py"
      - "connectors/google_search.py"
      - "bot.py"
      - "tests/**"
      - ".github/workflows/product-matching-tests.yml"
  pull_request:
    paths:
      - "product_matching.py"
      - "search_query.py"
      - "connectors/google_search.py"
      - "bot.py"
      - "tests/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check Python syntax
        run: python -m py_compile bot.py connectors/google_search.py

      - name: Run product matching tests
        run: python -m unittest discover -s tests -v
