name: Check price subscriptions

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: price-subscription-check
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake CENOED and check subscriptions
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 20 \
            --max-time 300 \
            https://cenoed.onrender.com/tasks/check-prices
